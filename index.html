<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Streaming Services & Apps</title>
    <script>
        (function() {
            const savedScale = localStorage.getItem('system_display_scale');
            if (savedScale) {
                const factor = parseFloat(savedScale) / 100;
                try {
                    const { webFrame } = require('electron');
                    webFrame.setZoomFactor(factor);
                } catch(e) {
                    document.documentElement.style.zoom = factor;
                }
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #141414;
            --panel-active: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-color: #ffd700;
            --danger-color: #ff4757;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 72px;
            box-sizing: border-box;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
        }

        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { height: 32px; width: auto; object-fit: contain; }
        .header-right { display: flex; align-items: center; gap: 18px; }

        .clock {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-right: 6px;
        }

        .nav-btn {
            background-color: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--accent-color);
        }
        .nav-btn:hover {
            transform: scale(1.08);
            background-color: rgba(42, 42, 42, 0.95);
            border-color: var(--accent-color);
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.35);
        }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
        }
        .nav-btn.active svg { stroke: #000000; }
        .nav-btn svg {
            width: 24px; height: 24px; stroke: var(--accent-color);
            fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        /* App Categories */
        .content-wrapper { position: relative; z-index: 20; padding-top: 120px; padding-bottom: 80px; }
        .category-section { padding: 16px 0; box-sizing: border-box; display: flex; flex-direction: column; }
        .section-header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 0 72px; z-index: 25; }
        .header-title-box { display: flex; align-items: center; gap: 16px; }
        .category-title { font-size: 26px; font-weight: 700; color: var(--text-color); margin: 0; letter-spacing: 0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

        .apps-container { position: relative; width: 100%; }
        .apps-grid {
            display: flex; flex-wrap: wrap; gap: 28px; padding: 40px 72px 80px 72px; justify-content: flex-start;
        }

        /* App Cards */
        .app-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            text-decoration: none; width: 140px; 
            cursor: pointer; position: relative; transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .app-wrapper.is-dragging { opacity: 0.35; transform: scale(0.92); }
        .app-wrapper.drag-over { transform: scale(1.08); }
        .app-wrapper.drag-over .card { border-color: var(--accent-color); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        .card {
            width: 140px; height: 140px; border-radius: 50%; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; position: relative;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
        }
        .card .glow {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: var(--brand, var(--accent-color)); filter: blur(30px); opacity: 0;
            transition: opacity 0.4s ease; z-index: -1; pointer-events: none;
        }
        .card-logo { width: 75px; height: 75px; object-fit: contain; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 2; }
        .card-label {
            font-size: 15px; font-weight: 600; color: var(--text-muted); text-align: center;
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden; width: 100%; transition: color 0.3s ease;
        }
        .app-wrapper:hover .card { transform: translateY(-16px) scale(1.05); border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); }
        .app-wrapper:hover .card .glow { opacity: 0.55; }
        .app-wrapper:hover .card-logo { transform: scale(1.15); }
        .app-wrapper:active .card { transform: scale(0.95); }
        .app-wrapper:hover .card-label { color: var(--text-color); }

        /* Edit Mode Badges and Controls */
        .delete-app-btn { position: absolute; top: 2px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: #ff334b; color: #fff; border: 2px solid #000; font-size: 18px; font-weight: bold; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 30; box-shadow: 0 4px 10px rgba(0,0,0,0.6); transition: transform 0.15s ease, background 0.15s ease; }
        .delete-app-btn:hover { transform: scale(1.2); background: #ff0022; }
        .reorder-bar { display: none; align-items: center; justify-content: center; gap: 8px; margin-top: -6px; z-index: 25; }
        .reorder-btn { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 6px; width: 28px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 800; font-size: 16px; transition: all 0.15s ease; }
        .reorder-btn:hover:not(:disabled) { background: var(--accent-color); color: #000; }
        .reorder-btn:disabled { opacity: 0.2; cursor: default; }

        body.edit-mode .app-wrapper.editable .delete-app-btn { display: flex; }
        body.edit-mode .app-wrapper.editable .reorder-bar { display: flex; }
        body.edit-mode .app-wrapper.editable .card { border-style: dashed; border-color: rgba(255, 215, 0, 0.45); }

        .add-card { border: 2px dashed rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.02); }
        .add-card:hover { border-color: var(--accent-color); background: rgba(255, 215, 0, 0.08); transform: translateY(-10px) scale(1.05); }
        .add-card svg { width: 44px; height: 44px; stroke: var(--accent-color); fill: none; stroke-width: 2; }
        .invert-dark { filter: brightness(0) invert(1); }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-container { background: #18181c; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 20px; width: 100%; max-width: 520px; box-shadow: 0 24px 60px rgba(0,0,0,0.9); overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 24px 28px 16px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .modal-title { margin: 0; font-size: 1.4rem; color: var(--accent-color); font-weight: 700; }
        .close-modal-btn { background: transparent; border: none; color: #888; font-size: 28px; line-height: 1; cursor: pointer; transition: color 0.2s ease; }
        .close-modal-btn:hover { color: #fff; }
        .modal-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; max-height: 70vh; overflow-y: auto; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 0.95rem; font-weight: 600; color: #ccc; }
        .form-input, .form-select { background: #0d0d10; border: 1px solid #333; color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.2s ease; }
        .form-input:focus, .form-select:focus { border-color: var(--accent-color); }
        .form-helper { font-size: 0.8rem; color: var(--text-muted); }
        .btn-sm { background: rgba(255, 215, 0, 0.15); color: var(--accent-color); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .btn-sm:hover { background: rgba(255, 215, 0, 0.3); }
        .color-presets { display: flex; gap: 10px; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s ease, border-color 0.2s ease; }
        .color-dot:hover { transform: scale(1.2); border-color: #fff; }
        .modal-footer { padding: 16px 28px 24px 28px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
        .modal-btn { padding: 12px 24px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s ease; }
        .modal-btn.primary { background: var(--accent-color); color: #000; }
        .modal-btn.primary:hover { background: #ffe234; box-shadow: 0 4px 16px rgba(255,215,0,0.4); }
        .modal-btn.secondary { background: rgba(255, 255, 255, 0.08); color: #ccc; }
        .modal-btn.secondary:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .reset-defaults-btn { background: none; border: 1px solid #444; color: #888; padding: 6px 14px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .reset-defaults-btn:hover { border-color: var(--danger-color); color: var(--danger-color); }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://resources.jakerowe.me/logos/rowe/logo-white.png" alt="Rowe Logo" class="logo">
        </div>
        
        <div class="header-right">
            <div id="clock" class="clock"></div>
            <button id="customize-btn" class="nav-btn" aria-label="Customize Apps" title="Customize Apps" onclick="toggleEditMode()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
            </button>
            <a href="settings.html" class="nav-btn" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </a>
        </div>
    </header>

    <div class="content-wrapper" id="content-root"></div>

    <!-- ADD APP MODAL -->
    <div id="add-app-modal" class="modal-overlay" onclick="if(event.target===this) closeAddModal()">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Add Application</h3>
                <button class="close-modal-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="new-app-category" class="form-select">
                        <option value="movies_tv">Movies and TV</option>
                        <option value="music">Music</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Application Name</label>
                    <input type="text" id="new-app-name" class="form-input" placeholder="e.g. Plex, Twitch">
                </div>
                <div class="form-group">
                    <label class="form-label">Website URL</label>
                    <input type="url" id="new-app-url" class="form-input" placeholder="https://..." onblur="autoSuggestDetails()">
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #ddd; font-size: 0.95rem;">
                        <input type="checkbox" id="new-app-tv-mode" style="width: 18px; height: 18px; accent-color: var(--accent-color);">
                        Enable TV Mode (Use Smart TV User Agent)
                    </label>
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="form-label">Logo / Icon URL</label>
                        <button type="button" class="btn-sm" onclick="autoDetectLogo()">Auto-Detect Logo</button>
                    </div>
                    <input type="url" id="new-app-logo" class="form-input" placeholder="https://..." oninput="updateLogoPreview()">
                    <div id="logo-preview-box" style="margin-top: 6px; display: none; align-items: center; gap: 10px;">
                        <span style="font-size: 0.85rem; color: #888;">Preview:</span>
                        <img id="logo-preview-img" src="" style="width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.06); padding: 4px;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Brand Glow Color</label>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <input type="color" id="new-app-color" value="#FFD700" style="width: 44px; height: 44px; border: none; border-radius: 8px; cursor: pointer; background: transparent;">
                        <div class="color-presets">
                            <span class="color-dot" style="background: #E50914;" onclick="setNewColor('#E50914')"></span>
                            <span class="color-dot" style="background: #00A8E1;" onclick="setNewColor('#00A8E1')"></span>
                            <span class="color-dot" style="background: #1CE783;" onclick="setNewColor('#1CE783')"></span>
                            <span class="color-dot" style="background: #9146FF;" onclick="setNewColor('#9146FF')"></span>
                            <span class="color-dot" style="background: #FFD700;" onclick="setNewColor('#FFD700')"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeAddModal()">Cancel</button>
                <button class="modal-btn primary" onclick="saveNewApp()">Add App</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // Open URL locally in the viewer wrapper
        function playOnDevice(targetUrl) {
            // Check if it is a local relative page (like settings.html)
            if (!targetUrl.startsWith('http') && !targetUrl.includes('viewer.html')) {
                window.location.href = targetUrl;
                return;
            }

            // If it's already a viewer.html URL, use it directly
            if (targetUrl.includes('viewer.html?url=')) {
                window.location.href = targetUrl;
                return;
            }

            // Extract the target URL and check if it contains the ua=tv flag
            let finalUrl = targetUrl;
            let suffix = '';
            
            if (finalUrl.endsWith('&ua=tv') || finalUrl.endsWith('?ua=tv')) {
                finalUrl = finalUrl.replace(/[\?&]ua=tv$/, '');
                suffix = '&ua=tv';
            }

            window.location.href = `viewer.html?url=${encodeURIComponent(finalUrl)}${suffix}`;
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // APP CONFIGURATIONS
        const DEFAULT_APPS = {
            movies_tv: [
                { id: 'netflix', name: 'Netflix', url: 'https://www.netflix.com', brand: '#E50914', logo: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Netflix_2016_N_logo.svg/960px-Netflix_2016_N_logo.svg.png' },
                { id: 'hulu', name: 'Hulu', url: 'https://www.hulu.com', brand: '#1CE783', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/03/Hulu_logo_%282014%29.svg' },
                { id: 'max', name: 'Max', url: 'https://www.max.com', brand: '#022CE7', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg', invertDark: true },
                { id: 'disneyplus', name: 'Disney+', url: 'https://www.disneyplus.com', brand: '#113CCF', logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg', invertDark: true },
                { id: 'primevideo', name: 'Prime Video', url: 'https://www.primevideo.com', brand: '#00A8E1', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
                { id: 'appletv', name: 'Apple TV+', url: 'https://tv.apple.com', brand: '#FFFFFF', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/28/Apple_TV_Plus_Logo.svg', invertDark: true },
                { id: 'peacock', name: 'Peacock', url: 'https://www.peacocktv.com', brand: '#FFFFFF', logo: 'https://upload.wikimedia.org/wikipedia/commons/f/fb/NBCUniversal_Peacock_Logo_%282020%E2%80%932026%29.svg' },
                { id: 'paramountplus', name: 'Paramount+', url: 'https://www.paramountplus.com', brand: '#0064FF', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Paramount_Plus.svg' },
                { id: 'crunchyroll', name: 'Crunchyroll', url: 'https://www.crunchyroll.com', brand: '#F47521', logo: 'https://upload.wikimedia.org/wikipedia/commons/f/f6/Crunchyroll_Logo.svg' },
                { id: 'youtube', name: 'YouTube', url: 'https://www.youtube.com/tv&ua=tv', brand: '#FF0000', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg' },
                { id: 'plutotv', name: 'Pluto TV', url: 'https://pluto.tv', brand: '#F5D211', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Pluto_TV_logo_2024.svg', invertDark: true },
                { id: 'espn', name: 'ESPN', url: 'https://www.espn.com', brand: '#CC0000', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg' },
                { id: 'foxone', name: 'Fox One', url: 'https://www.fox.com/', brand: '#183A68', logo: 'https://upload.wikimedia.org/wikipedia/commons/7/77/Fox_One_2025.svg', invertDark: true }
            ],
            music: [
                { id: 'spotify', name: 'Spotify', url: 'https://open.spotify.com', brand: '#1DB954', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg' },
                { id: 'ytmusic', name: 'YouTube Music', url: 'https://music.youtube.com', brand: '#FF0000', logo: 'https://upload.wikimedia.org/wikipedia/commons/6/6a/Youtube_Music_icon.svg' }
            ],
            utilities: [
                { id: 'chrome', name: 'Google Chrome', url: 'https://www.google.com', brand: '#4285F4', logo: 'https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg' },
                { id: 'stats', name: 'Live Sports Stats', url: 'stats.html', brand: '#FFD700', svgIcon: 'stats' },
                { id: 'fast', name: 'Internet Speed Test', url: 'https://fast.com', brand: '#00e5ff', svgIcon: 'speed' },
                { id: 'weather', name: 'Weather Radar', url: 'https://weather.com', brand: '#0284C7', svgIcon: 'weather' },
                { id: 'settings', name: 'Device Settings', url: 'settings.html', brand: '#FFD700', svgIcon: 'settings' }
            ]
        };

        const CATEGORIES = [
            { key: 'movies_tv', title: 'Movies and TV', editable: true },
            { key: 'music', title: 'Music', editable: true },
            { key: 'utilities', title: 'Utilities', editable: false }
        ];

        let appData = loadApps();
        let isEditMode = false;
        let dragSource = null;

        function loadApps() {
            try {
                const saved = localStorage.getItem('streaming_pc_apps_remote_v1');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.movies_tv && parsed.music && parsed.utilities) return parsed;
                }
            } catch(e) {}
            return JSON.parse(JSON.stringify(DEFAULT_APPS));
        }

        function saveApps() {
            localStorage.setItem('streaming_pc_apps_remote_v1', JSON.stringify(appData));
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);
            document.getElementById('customize-btn').classList.toggle('active', isEditMode);
            renderAppRows();
        }

        function getAppIconHtml(app) {
            if (app.svgIcon === 'stats') return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`;
            if (app.svgIcon === 'speed') return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><path d="M12 2v4"></path><path d="m4.93 4.93 2.83 2.83"></path><path d="M2 12h4"></path><path d="m4.93 19.07 2.83-2.83"></path><path d="M12 22v-4"></path><path d="m19.07 19.07-2.83-2.83"></path><path d="M22 12h-4"></path><path d="m19.07 4.93-2.83 2.83"></path><path d="M12 12l4-4"></path></svg>`;
            if (app.svgIcon === 'weather') return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>`;
            if (app.svgIcon === 'settings') return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #ffd700; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`;
            
            const invertClass = app.invertDark ? 'invert-dark' : '';
            return `<img src="${app.logo || 'https://resources.jakerowe.me/logos/rowe/logo-white.png'}" alt="${app.name}" class="card-logo ${invertClass}" onerror="this.src='https://resources.jakerowe.me/logos/rowe/logo-white.png'">`;
        }

        function renderAppRows() {
            const root = document.getElementById('content-root');
            let html = '';

            CATEGORIES.forEach(cat => {
                const apps = appData[cat.key] || [];
                const isEditable = cat.editable;

                const cardsHtml = apps.map((app, index) => {
                    const iconHtml = getAppIconHtml(app);
                    const editableClass = isEditable ? 'editable' : '';

                    return `
                        <div class="app-wrapper ${editableClass}" 
                             style="--brand: ${app.brand || '#ffd700'};" 
                             title="${app.name}"
                             draggable="${isEditable && isEditMode}"
                             ondragstart="${isEditable ? `onDragStart(event, '${cat.key}', ${index})` : ''}"
                             ondragover="${isEditable ? 'onDragOver(event)' : ''}"
                             ondragenter="${isEditable ? 'onDragEnter(event)' : ''}"
                             ondragleave="${isEditable ? 'onDragLeave(event)' : ''}"
                             ondrop="${isEditable ? `onDrop(event, '${cat.key}', ${index})` : ''}"
                             ondragend="${isEditable ? 'onDragEnd(event)' : ''}"
                             onclick="if(!isEditMode) { playOnDevice('${app.url}'); }">
                            
                            ${isEditable ? `<button class="delete-app-btn" onclick="event.stopPropagation(); removeApp('${cat.key}', ${index})" title="Remove ${app.name}">&times;</button>` : ''}
                            
                            <div class="card">
                                <div class="glow"></div>
                                ${iconHtml}
                            </div>
                            <span class="card-label">${app.name}</span>
                            
                            ${isEditable ? `
                                <div class="reorder-bar" onclick="event.stopPropagation();">
                                    <button class="reorder-btn" onclick="moveApp('${cat.key}', ${index}, -1)" ${index === 0 ? 'disabled' : ''} title="Move Left">&lsaquo;</button>
                                    <button class="reorder-btn" onclick="moveApp('${cat.key}', ${index}, 1)" ${index === apps.length - 1 ? 'disabled' : ''} title="Move Right">&rsaquo;</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                const addCardHtml = isEditable ? `
                    <div class="app-wrapper add-app-card" onclick="openAddModal('${cat.key}')" title="Add Application">
                        <div class="card add-card">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </div>
                        <span class="card-label" style="color: var(--accent-color);">+ Add App</span>
                    </div>
                ` : '';

                html += `
                    <div class="category-section" id="section-${cat.key}">
                        <div class="section-header-wrapper">
                            <div class="header-title-box">
                                <h2 class="category-title">${cat.title}</h2>
                                ${isEditable && isEditMode ? `<button class="reset-defaults-btn" onclick="resetDefaults('${cat.key}')">Restore Defaults</button>` : ''}
                            </div>
                        </div>
                        
                        <div class="apps-container">
                            <div class="apps-grid">
                                ${cardsHtml}
                                ${addCardHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            root.innerHTML = html;
        }

        // Drag/Drop logic
        function moveApp(catKey, index, delta) {
            const arr = appData[catKey];
            const targetIndex = index + delta;
            if (targetIndex < 0 || targetIndex >= arr.length) return;
            const [item] = arr.splice(index, 1);
            arr.splice(targetIndex, 0, item);
            saveApps();
            renderAppRows();
        }
        function removeApp(catKey, index) {
            if (confirm(`Remove "${appData[catKey][index].name}" from your apps?`)) {
                appData[catKey].splice(index, 1);
                saveApps();
                renderAppRows();
            }
        }
        function resetDefaults(catKey) {
            if (confirm(`Reset ${catKey} apps back to system defaults?`)) {
                appData[catKey] = JSON.parse(JSON.stringify(DEFAULT_APPS[catKey]));
                saveApps();
                renderAppRows();
            }
        }
        function onDragStart(e, catKey, index) {
            dragSource = { catKey, index };
            e.currentTarget.classList.add('is-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', `${catKey}:${index}`);
        }
        function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
        function onDragEnter(e) { if (e.currentTarget.classList.contains('app-wrapper')) e.currentTarget.classList.add('drag-over'); }
        function onDragLeave(e) { if (e.currentTarget.classList.contains('app-wrapper')) e.currentTarget.classList.remove('drag-over'); }
        function onDrop(e, catKey, targetIndex) {
            e.preventDefault();
            document.querySelectorAll('.app-wrapper').forEach(el => el.classList.remove('drag-over', 'is-dragging'));
            if (!dragSource || dragSource.catKey !== catKey || dragSource.index === targetIndex) return;
            const arr = appData[catKey];
            const [item] = arr.splice(dragSource.index, 1);
            arr.splice(targetIndex, 0, item);
            dragSource = null;
            saveApps();
            renderAppRows();
        }
        function onDragEnd(e) {
            document.querySelectorAll('.app-wrapper').forEach(el => el.classList.remove('drag-over', 'is-dragging'));
            dragSource = null;
        }

        // Add App Modal
        function openAddModal(catKey = 'movies_tv') {
            document.getElementById('new-app-category').value = catKey === 'utilities' ? 'movies_tv' : catKey;
            document.getElementById('new-app-name').value = '';
            document.getElementById('new-app-url').value = '';
            document.getElementById('new-app-logo').value = '';
            document.getElementById('new-app-color').value = '#FFD700';
            document.getElementById('new-app-tv-mode').checked = false;
            document.getElementById('logo-preview-box').style.display = 'none';
            document.getElementById('add-app-modal').style.display = 'flex';
        }
        function closeAddModal() { document.getElementById('add-app-modal').style.display = 'none'; }
        function setNewColor(hex) { document.getElementById('new-app-color').value = hex; }
        
        function autoSuggestDetails() {
            const urlVal = document.getElementById('new-app-url').value.trim();
            if (!urlVal) return;
            try {
                let fullUrl = urlVal;
                if (!fullUrl.startsWith('http://') && !fullUrl.startsWith('https://')) fullUrl = 'https://' + fullUrl;
                document.getElementById('new-app-url').value = fullUrl;
                const hostParts = new URL(fullUrl).hostname.replace('www.', '').split('.');
                const brandName = hostParts[0].charAt(0).toUpperCase() + hostParts[0].slice(1);
                if (!document.getElementById('new-app-name').value) document.getElementById('new-app-name').value = brandName;
                if (!document.getElementById('new-app-logo').value) autoDetectLogo();
            } catch(e) {}
        }
        function autoDetectLogo() {
            const urlVal = document.getElementById('new-app-url').value.trim();
            if (!urlVal) return alert('Please enter a website URL first.');
            try {
                let fullUrl = urlVal;
                if (!fullUrl.startsWith('http')) fullUrl = 'https://' + fullUrl;
                document.getElementById('new-app-logo').value = `https://www.google.com/s2/favicons?domain=${new URL(fullUrl).hostname}&sz=128`;
                updateLogoPreview();
            } catch(e) { alert('Invalid URL format'); }
        }
        function updateLogoPreview() {
            const val = document.getElementById('new-app-logo').value.trim();
            const box = document.getElementById('logo-preview-box');
            if (val) { document.getElementById('logo-preview-img').src = val; box.style.display = 'flex'; } 
            else { box.style.display = 'none'; }
        }

        function saveNewApp() {
            const cat = document.getElementById('new-app-category').value;
            const name = document.getElementById('new-app-name').value.trim();
            let urlVal = document.getElementById('new-app-url').value.trim();
            const logoVal = document.getElementById('new-app-logo').value.trim();
            const colorVal = document.getElementById('new-app-color').value;
            const isTv = document.getElementById('new-app-tv-mode').checked;

            if (!name) return alert('Please enter an application name.');
            if (!urlVal) return alert('Please enter a website URL.');
            if (!urlVal.startsWith('http://') && !urlVal.startsWith('https://')) urlVal = 'https://' + urlVal;

            let launchUrl = urlVal;
            if (isTv) launchUrl += (launchUrl.includes('?') ? '&' : '?') + 'ua=tv';

            if (!appData[cat]) appData[cat] = [];
            appData[cat].push({
                id: 'custom_' + Date.now(),
                name,
                url: launchUrl,
                brand: colorVal || '#ffd700',
                logo: logoVal || `https://www.google.com/s2/favicons?domain=${urlVal}&sz=128`
            });
            saveApps();
            renderAppRows();
            closeAddModal();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAppRows();
        });
    </script>
</body>
</html>
