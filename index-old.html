<!-- index.html (Updated) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Home</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #141414;
            --panel-active: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-color: #ffd700;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px 0 32px;
            box-sizing: border-box;
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .nav-btn {
            background-color: var(--bg-color);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(255, 255, 255, 0.05);
            transition: transform 0.1s ease, background-color 0.1s ease;
            cursor: pointer;
            border: none;
        }

        .nav-btn:active {
            background-color: var(--panel-active);
            transform: scale(0.95);
        }

        .nav-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .grid-container {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 24px;
            padding: 24px 32px 32px 32px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.1s ease, background-color 0.1s ease, border-color 0.2s ease;
            cursor: pointer;
            gap: 16px;
        }

        .card:active {
            transform: scale(0.95);
            background-color: var(--panel-active);
            border-color: var(--text-muted);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .card.empty {
            opacity: 0.3;
            cursor: default;
            border-style: dashed;
        }

        .card.empty:active {
            transform: none;
            background-color: var(--panel-bg);
            border-color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://resources.jakerowe.me/logos/rowe/logo-white.png" alt="Rowe Logo" class="logo">
        </div>
        
        <!-- Updated to link to the new settings.html page -->
        <a href="settings.html" class="nav-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
    </header>

    <div class="grid-container">
        <!-- Weather Card -->
        <a href="weather.html" class="card">
            <svg class="card-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="card-title">Weather</span>
        </a>

        <!-- Clock & Timers Card -->
        <a href="clock.html" class="card">
            <svg class="card-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="card-title">Clock & Timers</span>
        </a>

        <!-- Live Sports Card -->
        <a href="stats.html" class="card">
            <svg class="card-icon" viewBox="0 0 24 24">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
            <span class="card-title">Live Sports</span>
        </a>

        <!-- Now Playing (Jellyfin Placeholder) -->
        <a href="#" class="card" onclick="alert('Now Playing will launch here')">
            <svg class="card-icon" viewBox="0 0 24 24">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span class="card-title">Now Playing</span>
        </a>

        <!-- Photo Frame Placeholder -->
        <a href="#" class="card" onclick="alert('Photo Frame will launch here')">
            <svg class="card-icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="card-title">Photo Frame</span>
        </a>

        <!-- Empty slot to complete the 2x3 grid -->
        <div class="card empty"></div>
    </div>

</body>
</html>
